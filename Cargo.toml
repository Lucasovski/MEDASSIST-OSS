[workspace]
resolver = "2"
members = [
    "crates/medassist-domain",
    "crates/medassist-application",
    "crates/medassist-infrastructure",
    "crates/medassist-api",
    "crates/medassist-cli",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.75"
license = "GPL-3.0-or-later"
repository = "https://github.com/medassist-oss/medassist-oss"
authors = ["MedAssist OSS Contributors"]

[workspace.dependencies]
# Internal crates
medassist-domain = { path = "crates/medassist-domain" }
medassist-application = { path = "crates/medassist-application" }
medassist-infrastructure = { path = "crates/medassist-infrastructure" }
medassist-api = { path = "crates/medassist-api" }

# Async runtime
tokio = { version = "1", features = ["full"] }

# Web
axum = { version = "0.7", features = ["macros", "multipart"] }
tower = "0.4"
tower-http = { version = "0.5", features = ["trace", "cors", "limit"] }

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Errors / observability
thiserror = "1"
anyhow = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }

# Identity / time / numbers
uuid = { version = "1", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
rust_decimal = { version = "1", features = ["serde-str"] }

# Persistence
sqlx = { version = "0.7", default-features = false, features = ["runtime-tokio-rustls", "postgres", "uuid", "chrono", "json", "migrate"] }

# Security
argon2 = "0.5"
rand = "0.8"
subtle = "2"

# Config
dotenvy = "0.15"

# Async trait compat (Rust 2021)
async-trait = "0.1"

# Hashing (document integrity)
sha2 = "0.10"

# Multipart uploads
multer = "3"

# HTTP client (AI providers)
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json"] }

# Testing
hyper = { version = "1", features = ["full"] }

[profile.release]
lto = "thin"
codegen-units = 1
panic = "abort"
